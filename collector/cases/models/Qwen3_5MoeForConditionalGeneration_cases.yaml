schema_version: 1
architecture: Qwen3_5MoeForConditionalGeneration
model_path: Qwen/Qwen3.5-397B-A17B
model_paths:
  - Qwen/Qwen3.5-35B-A3B
  - Qwen/Qwen3.5-122B-A10B
  - Qwen/Qwen3.5-397B-A17B
  - nvidia/Qwen3.5-122B-A10B-NVFP4
  - nvidia/Qwen3.5-397B-A17B-NVFP4
  - nvidia/Qwen3.6-35B-A3B-NVFP4
include_base: true
base_ops:
  - attention_context
  - attention_generation
  - gemm
description: >
  Qwen3.5 MoE/GDN model-centric collection plan.

model_case_values:
  attention:
    - id: qwen35_35b_attention
      model_path: Qwen/Qwen3.5-35B-A3B
      model_aliases:
        - nvidia/Qwen3.6-35B-A3B-NVFP4
      num_attention_heads: 16
      num_key_value_heads: 2
      head_dim: 256
      window_size: 0
      sglang_backends: {90: fa3, 100: triton, 103: triton, 120: flashinfer}
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
    - id: qwen35_122b_attention
      model_path: Qwen/Qwen3.5-122B-A10B
      model_aliases:
        - nvidia/Qwen3.5-122B-A10B-NVFP4
      num_attention_heads: 32
      num_key_value_heads: 2
      head_dim: 256
      window_size: 0
      sglang_backends: {90: fa3, 100: triton, 103: triton, 120: flashinfer}
      tensor_parallel_sizes: [1, 2, 4, 8, 16, 32]
    - id: qwen35_397b_attention
      model_path: Qwen/Qwen3.5-397B-A17B
      model_aliases:
        - nvidia/Qwen3.5-397B-A17B-NVFP4
      num_attention_heads: 32
      num_key_value_heads: 2
      head_dim: 256
      window_size: 0
      sglang_backends: {90: fa3, 100: triton, 103: triton, 120: flashinfer}
      tensor_parallel_sizes: [1, 2, 4, 8, 16, 32]
  moe:
    - model_path: Qwen/Qwen3.5-35B-A3B
      hidden_size: 2048
      inter_size: 512
      topk: 8
      num_experts: 256
      sglang_moe_routing_method_type: RenormalizeNaive
      sglang_moe_backends:
        bfloat16: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
        fp8_block: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
    - model_path: Qwen/Qwen3.5-122B-A10B
      hidden_size: 3072
      inter_size: 1024
      topk: 8
      num_experts: 256
      sglang_moe_routing_method_type: RenormalizeNaive
      sglang_moe_backends:
        bfloat16: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
        fp8_block: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
    - model_path: Qwen/Qwen3.5-397B-A17B
      hidden_size: 4096
      inter_size: 1024
      topk: 10
      num_experts: 512
      sglang_moe_routing_method_type: RenormalizeNaive
      sglang_moe_backends:
        bfloat16: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
        fp8_block: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
    - model_path: nvidia/Qwen3.6-35B-A3B-NVFP4
      hidden_size: 2048
      inter_size: 512
      topk: 8
      num_experts: 256
      sglang_moe_routing_method_type: RenormalizeNaive
      framework_quantization:
        sglang:
          allowed_modes: [w4a16_nvfp4]
        trtllm:
          allowed_modes: [w4a16_nvfp4]
        vllm:
          allowed_modes: [w4a16_nvfp4]
    - model_path: nvidia/Qwen3.5-122B-A10B-NVFP4
      hidden_size: 3072
      inter_size: 1024
      topk: 8
      num_experts: 256
      sglang_moe_routing_method_type: RenormalizeNaive
      framework_quantization:
        sglang:
          allowed_modes: [nvfp4]
        trtllm:
          allowed_modes: [nvfp4]
        vllm:
          allowed_modes: [nvfp4]
    - model_path: nvidia/Qwen3.5-397B-A17B-NVFP4
      hidden_size: 4096
      inter_size: 1024
      topk: 10
      num_experts: 512
      sglang_moe_routing_method_type: RenormalizeNaive
      framework_quantization:
        sglang:
          allowed_modes: [nvfp4]
        trtllm:
          allowed_modes: [nvfp4]
        vllm:
          allowed_modes: [nvfp4]
  gemm:
    # Exact widths below the base feature grid (min 32): scalar shared-expert
    # gate (hidden -> 1) and GDN in_proj_ba (2 * num_v_heads / tp).
    - model_path: Qwen/Qwen3.5-35B-A3B
      model_aliases:
        - nvidia/Qwen3.6-35B-A3B-NVFP4
      output_feature_sizes: [1, 4, 8, 16]
      input_feature_sizes: [2048]
    - model_path: Qwen/Qwen3.5-122B-A10B
      model_aliases:
        - nvidia/Qwen3.5-122B-A10B-NVFP4
      output_feature_sizes: [1, 8, 16]
      input_feature_sizes: [3072]
    - model_path: Qwen/Qwen3.5-397B-A17B
      model_aliases:
        - nvidia/Qwen3.5-397B-A17B-NVFP4
      output_feature_sizes: [1, 8, 16]
      input_feature_sizes: [4096]
  gdn:
    # Decode kernel_source dispatch (collect_gdn.py, not expressed as case
    # shape axes below — kernel choice doesn't change GDN geometry):
    #   sm 90, 120     -> fused_recurrent_gated_delta_rule_packed_decode (fla/triton, fp32 state)
    #   sm 100, 103    -> fla/triton when mamba_ssm_dtype is float32;
    #                     FlashInfer only when mamba_ssm_dtype is bfloat16
    # sglang serving auto-selects the FlashInfer bf16-state decode kernel
    # only when is_sm100_supported() (capability major EXACTLY 10 — sm
    # 100/103 yes, sm 120 NO) AND the model's mamba_ssm_dtype is bfloat16
    # (server_args.py _handle_linear_attn_backend, :4884-4915 @0.5.14).
    # Every Qwen3.5/3.6 config pins mamba_ssm_dtype: float32 (declared per
    # row below), so this plan schedules no FlashInfer invocation.
    - model_path: Qwen/Qwen3.5-35B-A3B
      model_aliases:
        - nvidia/Qwen3.6-35B-A3B-NVFP4
      d_model: 2048
      d_conv: 4
      num_k_heads: 16
      head_k_dim: 128
      num_v_heads: 32
      head_v_dim: 128
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
      mamba_ssm_dtype: float32
    # 122B/397B attention declares TP32, but num_k_heads=16 cannot shard 32 ways — no TP32 GDN geometry.
    - model_path: Qwen/Qwen3.5-122B-A10B
      model_aliases:
        - nvidia/Qwen3.5-122B-A10B-NVFP4
      d_model: 3072
      d_conv: 4
      num_k_heads: 16
      head_k_dim: 128
      num_v_heads: 64
      head_v_dim: 128
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
      mamba_ssm_dtype: float32
    - model_path: Qwen/Qwen3.5-397B-A17B
      model_aliases:
        - nvidia/Qwen3.5-397B-A17B-NVFP4
      d_model: 4096
      d_conv: 4
      num_k_heads: 16
      head_k_dim: 128
      num_v_heads: 64
      head_v_dim: 128
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
      mamba_ssm_dtype: float32

all_frameworks_op_cases:
  moe:
    cases: all
  gdn:
    cases: all
