schema_version: 1
architecture: KimiK3ForConditionalGeneration
model_path: moonshotai/Kimi-K3
include_base: true
base_ops:
  - gemm
description: >
  Kimi-K3 hybrid KDA/MLA LatentMoE model-centric collection plan.
  Text backbone (KimiLinearConfig): hidden 7168, 93 layers = 69 KDA linear
  attention + 24 MLA full attention, layer 0 dense MLP; LatentMoE routes
  896 experts (top-16, SiTU activation) in a 3584-wide latent space with
  moe_intermediate_size 3072; MXFP4 routed-expert weights. The DSPARK draft
  model (RadixArk/Kimi-K3-DSpark) is a 5-layer dense GQA transformer whose
  attention shape is declared here because it serves inside the K3 engine.

model_case_values:
  # DSPARK draft model attention (RadixArk/Kimi-K3-DSpark): 64 query heads,
  # 16 KV heads, head_dim 64, full attention. Target MLA layers are covered
  # by the mla rows below; KDA layers by the kda rows.
  attention:
    - id: kimi_k3_dspark_draft_attention
      model_path: moonshotai/Kimi-K3
      num_attention_heads: 64
      num_key_value_heads: 16
      head_dim: 64
      window_size: 0
      sglang_backends: {90: fa3, 100: trtllm_mha, 103: trtllm_mha}
      tensor_parallel_sizes: [1, 2, 4, 8]
    # vLLM 0.27.0's upstream K3 MLA is a real MLA lane (via
    # vllm/models/kimi_k3/nvidia/mla.py MultiHeadLatentAttention ->
    # get_attn_backend(use_mla=True)); aiconfigurator's kimi_k3 model
    # prices its 24 full-attention layers against the module-level MLA
    # tables with FallbackOp GQA fallback to THIS attention profile for
    # systems without 96-head module rows (see mla_module section).
    # Declared framework-agnostic (the generator has no framework-scoped
    # attention profiles); the extra sglang expansion is interpolation
    # support.
    - id: kimi_k3_mla_as_attention
      model_path: moonshotai/Kimi-K3
      num_attention_heads: 96
      num_key_value_heads: 96
      head_dim: 128
      window_size: 0
      tensor_parallel_sizes: [1, 2, 4, 8]
  moe:
    # LatentMoE routed experts run in the 3584 latent space (not model
    # hidden 7168): gate/up 3584->3072, down 3072->3584, SiTU activation.
    - model_path: moonshotai/Kimi-K3
      hidden_size: 3584
      inter_size: 3072
      topk: 16
      num_experts: 896
      sglang_moe_scoring_func: sigmoid
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 1.0
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      sglang_moe_num_expert_group: 1
      sglang_moe_topk_group: 1
      sglang_moe_backends:
        # kimi-k3 branch dispatch: Blackwell -> flashinfer_mxfp4
        # (trtllm-gen SiTU), SM90 -> marlin W4A16 (cookbook §2 MoE runner).
        # SM89/120 keys made explicit (previously rode the base map's
        # GPT-OSS-era citations): the branch's K3 moe-runner override fires
        # on SM100/103 ONLY and otherwise leaves auto
        # (arg_groups/overrides.py:479-504 @ c6ad1f26 — the flashinfer_mxfp4
        # default is gated `get_device_sm() in (100, 103)`), so SM120
        # resolves to the marlin W4A16 repack lane like SM90 and SM89 stays
        # on the Triton default — matching the collected kernel_source truth
        # (rtx marlin, l40s triton).
        w4a16_mxfp4: {89: triton, 90: marlin, 100: flashinfer_mxfp4, 103: flashinfer_mxfp4, 120: marlin}
        # Blackwell serving truth: the branch's Mxfp4MoEMethod default
        # precision quantizes activations to mxfp8 (per_token_group_quant
        # group 32 / mxfp8_quantize -> trtllm_fp4_block_scale_moe,
        # mxfp4.py:1311-1330 @ kimi-k3 branch; B300 nsys shows the
        # bmm_MxE4m3_MxE2m1MxE4m3 kernels). The base moe.yaml quant-mode
        # axis gates this label to SM in [100, 120). Hopper keeps the
        # bf16-activation marlin W4A16 lane above.
        w4a8_mxfp4_mxfp8: {100: flashinfer_mxfp4, 103: flashinfer_mxfp4}
      # Do not enroll K3 in the standalone DeepEP WideEP collectors.  The
      # pinned vLLM 0.24.0 source predates K3 serving support, and the current
      # vLLM/SGLang K3 expert-parallel serving path selects MegaMoE
      # (deep_gemm_mega_moe / --moe-a2a-backend megamoe), whose fused
      # A2A+GEMM path is not represented by the DeepEP communication table.
      framework_quantization:
        sglang:
          allowed_modes: [w4a16_mxfp4, w4a8_mxfp4_mxfp8]
        # No trtllm K3 lane exists (review 2026-08-04): moe is activated only
        # for sglang/vllm below, so a K3-scoped trtllm run plans no moe at
        # all. The explicit empty allowlist keeps CROSS-MODEL trtllm sweeps
        # (getter runs with no model filter) from planning K3 under the
        # base ungated modes (bfloat16/fp8/...), and the trtllm getter now
        # logs the fully-dropped model instead of silently expanding to
        # zero (case_authoring.md).
        trtllm:
          allowed_modes: []
        vllm:
          allowed_modes: [w4a16_mxfp4]
  mla:
    # K3 MLA: 96 heads, NoPE (rope slice projected/cached but positionless),
    # plus an output gate handled as a standard GEMM. Kernel-shape-wise it is
    # the DeepSeek MLA geometry, so the historical 128/64-head tables apply;
    # declare the native 96-head profile for exact hits.
    - model_path: moonshotai/Kimi-K3
      num_heads: 96
      q_lora_rank: 1536
      kv_lora_rank: 512
      qk_nope_head_dim: 128
      qk_rope_head_dim: 64
      v_head_dim: 128
  kda:
    # KDA structural tuple per attention-TP shard: 96 heads at TP1 shard to
    # 48/24/12 local heads at TP2/4/8. Each row is one physical kernel shape
    # (the persisted key is (d_model, num_k_heads, head_k_dim, num_v_heads,
    # head_v_dim, d_conv)); num_k_heads == num_v_heads for KDA.
    - model_path: moonshotai/Kimi-K3
      d_model: 7168
      d_conv: 4
      num_k_heads: 96
      head_k_dim: 128
      num_v_heads: 96
      head_v_dim: 128
    - model_path: moonshotai/Kimi-K3
      d_model: 7168
      d_conv: 4
      num_k_heads: 48
      head_k_dim: 128
      num_v_heads: 48
      head_v_dim: 128
    - model_path: moonshotai/Kimi-K3
      d_model: 7168
      d_conv: 4
      num_k_heads: 24
      head_k_dim: 128
      num_v_heads: 24
      head_v_dim: 128
    - model_path: moonshotai/Kimi-K3
      d_model: 7168
      d_conv: 4
      num_k_heads: 12
      head_k_dim: 128
      num_v_heads: 12
      head_v_dim: 128

framework_specific_model_case_values:
  vllm:
    # vLLM 0.27.0 upstream ships Kimi-K3's own MultiHeadLatentAttention
    # (vllm/models/kimi_k3/nvidia/mla.py: get_attn_backend(use_mla=True)
    # + MLAAttentionImpl over the 512+64 latent KV head). Price its cost via
    # the module-level MLA tables; deliver the exact 96-head module identity
    # (queries resolve native-nearest to the DeepSeek 128-head rows until
    # these land).
    mla_module:
      - model_path: moonshotai/Kimi-K3
        attention_type: mla
        architecture: KimiK3ForConditionalGeneration
        native_num_heads: 96
        wideep_mla: false

# moe is activated per-framework (NOT all_frameworks): K3 has no trtllm
# serving lane, and an all-frameworks activation made a K3-scoped trtllm run
# plan moe and expand it to zero cases with no logged drop (review
# 2026-08-04; case_authoring.md forbids silent zero expansions).
framework_specific_op_cases:
  vllm:
    moe:
      cases: all
    kda:
      cases: all
    attention_context:
      cases: all
    attention_generation:
      cases: all
    mla_bmm_gen_pre:
      cases: all
    mla_bmm_gen_post:
      cases: all
    # vLLM 0.27.0's upstream K3 MLA is a real MLA lane; the kimi_k3 model
    # prices its 24 full-attention layers against the module-level tables
    # (FallbackOp GQA fallback stays for pre-collection systems).
    mla_context_module:
      cases: all
    mla_generation_module:
      cases: all
  sglang:
    moe:
      cases: all
    attention_context:
      cases: all
    attention_generation:
      cases: all
    mla_context:
      cases: all
    mla_generation:
      cases: all
    mla_bmm_gen_pre:
      cases: all
    mla_bmm_gen_post:
      cases: all
    kda:
      cases: all
