# Framework-DEFAULT attention kernel per (backend, version, sm). Used as the
# lane-precedence head when no attention_backend override is set. Citations
# per collector-rule discipline; re-verify on version bumps.
sglang:
  "0.5.14":
    # collector/cases/models/Qwen3_5MoeForConditionalGeneration_cases.yaml
    # sglang_backends: {90: fa3, 100: triton, 103: triton, 120: flashinfer}
    # FIXME(lane-map): verify against sglang 0.5.14 attention-backend default dispatch on version bump
    90: fa3
    100: triton
    103: triton
    120: flashinfer
vllm:
  # Shipped vllm versions with no entry here (0.22.0, 0.19.0) resolve with no
  # framework-default pin and FAIL CLOSED to the plain ["default"] lane order
  # (the engine's own deterministic table fallback) — donor density is never
  # consulted for an unmapped version, because it is not evidence of the
  # framework default (PR #1519 review). Add entries only with a verifiable
  # source, like the sglang citations above.
  "0.24.0":
    90: default
    100: default
    103: default
