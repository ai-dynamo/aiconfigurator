schema_version: 1
architecture: MiniMaxM3ForCausalLM
model_path: MiniMaxAI/MiniMax-M3
model_paths:
  - MiniMaxAI/MiniMax-M3
  - nvidia/MiniMax-M3-NVFP4
include_base: true
description: >
  MiniMax-M3 MoE + MSA sparse-attention model-centric collection plan.
  Layers 0-2 are dense (GQA attention + 12288 dense MLP), layers 3-59 are
  MSA sparse attention + 128-expert top-4 MoE with one shared expert
  (shared_intermediate_size 3072). The MSA module is collected via the
  msa_*_module ops (attention_type: msa under mla_module); the dense
  layers' cost is approximated as MSA+MoE by the SDK model
  (aiconfigurator_core/sdk/models/minimax_m3.py docstring), so no dense
  attention profile is declared.

model_case_values:
  moe:
    # BF16 checkpoint. DeepSeekV3-style routing: fp32 sigmoid scoring +
    # e_score_correction_bias + routed_scaling_factor 2.0, no expert
    # groups (TRT-LLM modeling_minimaxm3.py MiniMaxM3Gate@1.3.0rc20;
    # HF config scoring_func=sigmoid, use_routing_bias=true,
    # routed_scaling_factor=2.0). The shared expert
    # (shared_intermediate_size 3072) is modeled by the SDK as separate
    # GEMM ops, not part of the routed-MoE benchmark shape.
    - model_path: MiniMaxAI/MiniMax-M3
      hidden_size: 6144
      inter_size: 3072
      topk: 4
      num_experts: 128
      sglang_moe_scoring_func: sigmoid
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 2.0
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      # BF16 artifact serves BF16 MoE. Quant-distinct artifacts get their
      # own rows (with their own model_path) — never merged here
      # (case_authoring.md: quant-distinct artifacts are separate rows);
      # see the nvidia/MiniMax-M3-NVFP4 row below.
      framework_quantization:
        trtllm:
          allowed_modes: [bfloat16]
        sglang:
          allowed_modes: [bfloat16]
        vllm:
          allowed_modes: [bfloat16]
    # nvidia/MiniMax-M3-NVFP4 (ModelOpt MIXED_PRECISION): routed experts
    # w1/w2/w3 are NVFP4 group_size 16 — the dtype this MoE row collects.
    # Attention/dense-MLP/shared-expert projections are MXFP8 (priced by the
    # SDK as fp8_block; not a routed-MoE artifact axis), block_sparse_moe.gate
    # stays unquantized. Same 6144/3072 topk4 x128 geometry and DeepSeekV3
    # sigmoid routing as the BF16 parent above. The base nvfp4 quant-mode axis
    # carries the min_sm 100 hardware floor (Blackwell-only collection).
    - model_path: nvidia/MiniMax-M3-NVFP4
      hidden_size: 6144
      inter_size: 3072
      topk: 4
      num_experts: 128
      sglang_moe_scoring_func: sigmoid
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 2.0
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      framework_quantization:
        trtllm:
          allowed_modes: [nvfp4]
        sglang:
          allowed_modes: [nvfp4]
        vllm:
          allowed_modes: [nvfp4]
  mla_module:
    # model_aliases (NOT model_paths): the MSA module benchmark is
    # artifact-insensitive — dummy weights, identical sparse geometry in both
    # checkpoints' configs, and the GEMM/KV precision is an explicit sweep
    # axis (never resolved from the artifact), so the NVFP4 artifact provably
    # cannot change the invoked kernel or the persisted key
    # (case_authoring.md aliasing rule). The alias keeps exact-targeting
    # COLLECTOR_MODEL_PATH=nvidia/MiniMax-M3-NVFP4 populating the MSA plan
    # (review 4969690316 Spec-2: an advertised artifact must not expand to
    # zero cases) while rows stay keyed to the single canonical model.
    - model_path: MiniMaxAI/MiniMax-M3
      model_aliases:
        - nvidia/MiniMax-M3-NVFP4
      attention_type: msa
      native_num_heads: 64

all_frameworks_op_cases:
  gemm:
    cases: all
  moe:
    cases: all

framework_specific_op_cases:
  trtllm:
    msa_context_module:
      cases: all
    msa_generation_module:
      cases: all
  vllm:
    msa_context_module:
      cases: all
    msa_generation_module:
      cases: all
  sglang:
    msa_context_module:
      cases: all
    msa_generation_module:
      cases: all
