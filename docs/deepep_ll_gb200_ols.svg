    <text x="285" y="462" text-anchor="middle">256</text>
    <text x="490" y="462" text-anchor="middle">512</text>
    <text x="695" y="462" text-anchor="middle">768</text>
    <text x="900" y="462" text-anchor="middle">1024</text>
    <text x="490" y="493" text-anchor="middle" font-size="14">Per-rank source tokens</text>
    <text x="20" y="240" text-anchor="middle" font-size="14" transform="rotate(-90 20 240)">Latency (µs)</text>
  </g>
  <path d="M80 404.6 L900 191.9" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M80 402.5 L900 66.6" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="1.2">
    <circle cx="80.8" cy="403.2" r="4"/><circle cx="81.6" cy="402.6" r="4"/>
    <circle cx="83.2" cy="402.1" r="4"/><circle cx="86.4" cy="401.2" r="4"/>
    <circle cx="92.8" cy="400.1" r="4"/><circle cx="105.6" cy="397.4" r="4"/>
    <circle cx="131.2" cy="391.9" r="4"/><circle cx="182.5" cy="380.3" r="4"/>
    <circle cx="285" cy="356.7" r="4"/><circle cx="490" cy="300.9" r="4"/>
    <circle cx="900" cy="189.1" r="4"/>
  </g>
  <g fill="#dc2626" stroke="#ffffff" stroke-width="1.2">
    <circle cx="80.8" cy="399.7" r="4"/><circle cx="81.6" cy="400.9" r="4"/>
    <circle cx="83.2" cy="399.8" r="4"/><circle cx="86.4" cy="398.5" r="4"/>
    <circle cx="92.8" cy="398.7" r="4"/><circle cx="105.6" cy="396.9" r="4"/>
    <circle cx="131.2" cy="382.3" r="4"/><circle cx="182.5" cy="359.5" r="4"/>
    <circle cx="285" cy="318.3" r="4"/><circle cx="490" cy="235.6" r="4"/>
    <circle cx="900" cy="66.0" r="4"/>
