schema_version: 1
architecture: Step3p7FlashForCausalLM
model_path: stepfun-ai/Step-3.7-Flash-FP8
model_paths:
  - stepfun-ai/Step-3.7-Flash-FP8
  - stepfun-ai/Step-3.7-Flash
include_base: true
base_ops:
  - gemm
framework_specific_base_ops:
  vllm:
    - attention_context
    - attention_generation
description: >
  StepFun Step-3.7-Flash hybrid plan: 1-full:3-SWA-512 GQA (64 Q / 8 KV, head_dim 128),
  dense-first-3 then 288-expert top-8 MoE (inter 1280) + one shared expert (dim 1280).
  Heals the 288-expert / inter-1280 MoE grouped-GEMM shape that AIC otherwise
  interpolates (database-mode HYBRID) on h100_sxm.

model_ops:
  - gemm
  - moe

all_frameworks_op_cases:
  moe:
    cases: all

framework_specific_op_cases:
  vllm:
    attention_context:
      cases: all
    attention_generation:
      cases: all

model_case_values:
  attention:
    # Two correlated rows, not one cross-product: the pinned vLLM Step3p5 block
    # substitutes 96 query heads on sliding_attention layers while global layers
    # keep 64. Cross-producting 64 heads with [0, 512] would plan 64-head SWA
    # cases that never run and omit the 96-head SWA cases that do.
    - id: step3p7_global_attention
      model_path: stepfun-ai/Step-3.7-Flash-FP8
      model_aliases:
        - stepfun-ai/Step-3.7-Flash
      num_attention_heads: 64
      num_key_value_heads: 8
      head_dim: 128
      window_size: 0
      tensor_parallel_sizes: [1, 2, 4, 8]
    - id: step3p7_swa_attention
      model_path: stepfun-ai/Step-3.7-Flash-FP8
      model_aliases:
        - stepfun-ai/Step-3.7-Flash
      num_attention_heads: 96
      num_key_value_heads: 8
      head_dim: 128
      window_size: 512
      tensor_parallel_sizes: [1, 2, 4, 8]
  moe:
    - model_paths:
        - stepfun-ai/Step-3.7-Flash-FP8
        - stepfun-ai/Step-3.7-Flash
      hidden_size: 4096
      inter_size: 1280
      topk: 8
      num_experts: 288
      # Routing contract, from the published config and Step3p7MoE.router_bias_func:
      # sigmoid over the gate, plus a correction bias added before top-k, then
      # renormalized (norm_expert_weight) and scaled by moe_router_scaling_factor.
      # Left at the defaults these would benchmark softmax with no bias and no
      # scaling -- a different MoE invocation from the one vLLM/SGLang serve.
      # The model declares no expert grouping, so num_expert_group/topk_group
      # stay unset.
      sglang_moe_scoring_func: sigmoid
      sglang_moe_has_correction_bias: true
      sglang_moe_renormalize: true
      sglang_moe_routed_scaling_factor: 3.0
