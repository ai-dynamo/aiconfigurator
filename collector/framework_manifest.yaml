#
# Collector V3 manifest (schema v2): one `default` runtime per framework plus
# explicit per-family overrides (design: docs/perf_database/
# collector-v3-op-centric-design.md §4). Public images are digest-pinned;
# bare internal image names are exempt. WideEP runtimes are peer framework
# entries (wideep_<base>) so per-op resolution is uniform.

schema_version: 2

frameworks:
  sglang:
    source_repo: "https://github.com/sgl-project/sglang.git"
    default:
      version: "0.5.14"
      images:
        default: "lmsysorg/sglang:v0.5.14@sha256:5027e95bf6ec536856b1b52a91d1f35ff5c564ab83e8a94758a169ff09bb8df3"
        cu130: "lmsysorg/sglang:v0.5.14-cu130@sha256:5027e95bf6ec536856b1b52a91d1f35ff5c564ab83e8a94758a169ff09bb8df3"
    families:
      # Kimi-K3 KDA kernels exist only on the sglang kimi-k3 branch
      # (https://github.com/sgl-project/sglang/tree/kimi-k3), whose build
      # reports 0.5.16. Pin the branch image for the kda family only.
      kda:
        version: "0.5.16"
        images:
          default: "lmsysorg/sglang@sha256:4b8a7542e00a4d82801d1276108438b024137c9a07f33215d03b04003e500f2b"
      # MiniMax-M3 (minimax_m3.py + minimax_sparse_ops) landed in the official
      # v0.5.16 release; the stock 0.5.14 default has no M3. Pin the official
      # tag for the msa family only (NOT the kimi-k3 branch build above, which
      # is a different container).
      msa:
        version: "0.5.16"
        images:
          default: "lmsysorg/sglang:v0.5.16@sha256:7b6a35df9839fd593a94a1eaee82d7777f472225d9f3ad1f8a2e0cb2bd1785d0"
  trtllm:
    source_repo: "https://github.com/NVIDIA/TensorRT-LLM.git"
    default:
      version: "1.3.0rc20"
      images:
        default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20@sha256:1532b38814b3faf2affdb5ef01ca91468685d314ffb7e8926a0567595355ed88"
    families:
      # MiniMax-M3: the true-sparse fmha_sm100 backend (implementation="msa",
      # SM100/103-only) landed in rc23; rc20 has only the Triton reference
      # path (measured identical-or-worse on SM90 at rc23, so the existing
      # existing SM90 msa data stays at rc20). Pin the msa family to rc23 for the
      # Blackwell collection.
      msa:
        version: "1.3.0rc23"
        images:
          default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc23@sha256:316b840a08a8174fc3f6b5716828bdfe1daaf629ee1ac2a8b7a22526d141a007"
  vllm:
    source_repo: "https://github.com/vllm-project/vllm.git"
    default:
      version: "0.24.0"
      images:
        default: "vllm/vllm-openai:v0.24.0@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f"
        cu129: "vllm/vllm-openai:v0.24.0-cu129@sha256:6b005c78cd17a1f0215f31e95d183833f4dfd6167c4473241b80d1c8843b91e8"
    families:
      # Kimi-K3 KDA kernels exist only on the vLLM kimi-k3 branch
      # (official preview image, CUDA 13 build with fused_kda_decode +
      # FlashKDA; setuptools-scm version 0.1.dev19262+gb6bbf29dd).
      kda:
        version: "0.1.dev19262"
        images:
          default: "vllm/vllm-openai@sha256:e90e2603b2781936651ba019804137714367c69e10a7b25a2e57b46995225616"
      # moe: NO family pin (owner decision 2026-08-02, reverting the
      # 2026-08-01 family-wide preview pin — a temporary preview build must
      # not own a family default; a family pin here hijacks image selection
      # for every model). ALL vllm moe collection — including K3 — runs on
      # the stock v0.24.0 default image: K3 SITU cases use the
      # owner-approved situ-as-silu Marlin approximation in collect_moe
      # (serving truth is MarlinExperts W4A16 on every SM — the preview's
      # CUTLASS whitelist rejects SITU; stock's device-only gate is forced
      # off so Blackwell doesn't drift into CUTLASS W4A4, a kernel K3
      # serving never runs; rows are marked kernel_source *_situ_as_silu,
      # epilogue delta <~3%). Already-collected K3 rows (b200/b300,
      # preview-native situ) stay merged in the 0.24.0 moe table with
      # their honest runtime version column. Retire the approximation when
      # upstream wires SITU into a quantized-activation kernel (kernel
      # class flips) — re-audit at every tag bump.
      # (2026-08-02 audit note kept for the preview image: the kimi-k3
      # tag's amd64 image is IDENTICAL to the pin digest —
      # 0.1.dev19262+gb6bbf29dd, no deep_gemm; the earlier "drift to
      # sha256:d61e062d" observation was the manifest list's arm64 entry,
      # not a new build. On aarch64 hosts (gb200/gb300) resolve the arm64
      # entry of the same tag and re-verify the version string before use.)
  vllm_xpu:
    base_framework: vllm
    data_backend: vllm
    notes: >
      Intel XPU collector runtime. This is intentionally separate from stock
      CUDA vLLM because the XPU collectors depend on vLLM 0.26.0 plus the
      matching vllm-xpu-kernels runtime contract.
    default:
      version: "0.26.0"
      images:
        default: "vllm/vllm-openai-xpu:v0.26.0@sha256:e2ab50957fc309d3fb110e6331ab8bfb7dd4f0074df41cbbf0bc3c64c8bc0e52"
  wideep_sglang:
    base_framework: sglang
    collector_dir: "collector/wideep/sglang"
    data_backend: sglang
    default:
      version: "0.5.10"
      images:
        default: "deepseek-v4-blackwell"
        grace_blackwell: "deepseek-v4-grace-blackwell"
    families:
      # DeepEP dispatch/combine only. The DeepSeek-V4 images ship deep_ep 1.1.0
      # (kNumMaxTopK 9), which cannot run topk=10 shapes such as
      # (4096, 512, 10); this image ships deep_ep 1.2.1+d28bd67 (kNumMaxTopK 11)
      # and collects them, verified on GB200. It is a multi-arch index (amd64 +
      # arm64), so one entry serves every system and no grace_blackwell variant
      # is needed. `moe` (wideep_moe) deliberately stays on the DeepSeek-V4
      # default: its DSv4 module support on this image is unverified.
      comm:
        version: "0.5.12"
        images:
          default: "lmsysorg/sglang:v0.5.12-cu130@sha256:42194170546745092e74cd5f81ad32a7c6e944c7111fe7bf13588152277ff356"
    notes: >
      Requires an SGLang image with DeepSeek-V4/DeepEP modules; stock
      lmsysorg/sglang images may not include them.
  wideep_trtllm:
    base_framework: trtllm
    collector_dir: "collector/wideep/trtllm"
    data_backend: trtllm
    default:
      version: "1.3.0rc20"
      images:
        default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20@sha256:1532b38814b3faf2affdb5ef01ca91468685d314ffb7e8926a0567595355ed88"
