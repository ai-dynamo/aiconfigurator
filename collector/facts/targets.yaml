schema: aic-probe-targets/v1
kv_pairing:
  bfloat16:
    kvcache: bfloat16
    cli: null
  fp8:
    kvcache: fp8
    cli: fp8_e4m3
  fp8_static:
    kvcache: fp8
    cli: fp8_e4m3
  nvfp4:
    kvcache: fp8
    cli: fp8_e4m3
  mxfp4:
    kvcache: bfloat16
    cli: null
  mxfp8:
    kvcache: fp8
    cli: fp8_e4m3
backends:
  sglang:
    versions:
    - 0.5.14
    - 0.5.16
    images:
      0.5.14: lmsysorg/sglang:v0.5.14
      0.5.16: lmsysorg/sglang:v0.5.16
  vllm:
    versions:
    - 0.24.0
    images:
      0.24.0: vllm-probe:0.24.0-fix
  trtllm:
    versions:
    - 1.3.0rc23
    images:
      1.3.0rc23: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc23
families:
  dsv4:
    known_sm90:
      sglang_0516: 'ue8m0-scale fp8 DSV4 checkpoints fail at trace on SM90 tp1: auto->triton MoE runner
        asserts ''Hidden size mismatch'' (w13 requantized to deepgemm ue8m0 layout at load; triton reads
        it transposed); explicit deep_gemm runner asserts SM100-only packed-fp4 branch (layout.hpp:57
        ''kPackedFP4 and arch_major == 10''). DEEPGEMM_SCALE_UE8M0 = DEEPGEMM_BLACKWELL in sglang — the
        ue8m0 requant path assumes Blackwell. Probe-verified 2026-08-20 (bisect A-I: generator CLI, mixed-chunk,
        page size, jitcache mount all excluded).'
      trtllm_rc23: 'DSV4 rejected at load: ''Missing COMPRESS pool metadata for compress ratio 4'' — CSA
        compression unsupported on this path.'
    architecture: DeepseekV4ForCausalLM
    checkpoints:
    - repo: deepseek-ai/DeepSeek-V4-Pro-0813
      profile: fp8
      aic_registered: deepseek-ai--DeepSeek-V4-Pro
      known: 'SM90: loads silently, Fp8MoEMethod over fp4-packed int8 experts, first MoE forward crashes
        (both sglang versions)'
      variant_overrides:
        vllm: interleave_pair
    - repo: deepseek-ai/DeepSeek-V4-Flash-0731
      profile: fp8
      aic_registered: deepseek-ai--DeepSeek-V4-Flash
      known: same W4A8 crash class as Pro
    - repo: nvidia/DeepSeek-V4-Pro-NVFP4
      profile: nvfp4
      aic_registered: false
      variant_overrides:
        vllm: interleave_pair
    - repo: nvidia/DeepSeek-V4-Flash-NVFP4
      profile: nvfp4
      aic_registered: false
      known: 'SM90: MoE dispatches to Marlin (bf16 dequant), NOT fp4 tensor cores'
    dummy_variants:
    - csa
    - hca
    - full
    - interleave_pair
    - dspark
    - hash
    - rep_mix
    variant_overrides:
      vllm: rep_mix
    render_overrides:
      vllm:
        tokens_per_block: null
  glm:
    architecture: GlmMoeDsaForCausalLM
    checkpoints:
    - repo: zai-org/GLM-5.2
      profile: bfloat16
      aic_registered: zai-org--GLM-5.2
      known: 'SM90 auto: KV bf16, dsa prefill=flashmla_sparse decode=fa3; dense FA3 branch below index_topk=2048'
    - repo: zai-org/GLM-5.2-FP8
      profile: fp8
      aic_registered: zai-org--GLM-5.2-FP8
      known: explicit fp8_e4m3 KV honored on SM90 -> flashmla_kv both phases; decode includes online K-cache
        quantize
    - repo: nvidia/GLM-5.2-NVFP4
      profile: nvfp4
      aic_registered: nvidia--GLM-5.2-NVFP4
    dummy_variants:
    - full_indexer_moe
    - shared_indexer_moe
  m3:
    architecture: MiniMaxM3SparseForConditionalGeneration
    checkpoints:
    - repo: MiniMaxAI/MiniMax-M3
      profile: bfloat16
      aic_registered: MiniMaxAI--MiniMax-M3
    - repo: MiniMaxAI/MiniMax-M3-MXFP8
      profile: mxfp8
      aic_registered: false
    - repo: nvidia/MiniMax-M3-NVFP4
      profile: nvfp4
      aic_registered: false
    dummy_variants:
    - moe_sparse_attn
    - dense_full_attn_head
    render_overrides:
      vllm:
        tokens_per_block: null
    notes: custom code (auto_map) — .py files fetched into variant dirs
  gptoss:
    architecture: GptOssForCausalLM
    checkpoints:
    - repo: openai/gpt-oss-120b
      profile: mxfp4
      aic_registered: openai--gpt-oss-120b
    - repo: openai/gpt-oss-20b
      profile: mxfp4
      aic_registered: openai--gpt-oss-20b
    dummy_variants:
    - interleave_pair
    - sliding_attention
    - full_attention
  roster:
    architecture: full support-matrix roster (per-checkpoint, no arch dedup)
    derive: true
    extra_repos:
    - moonshotai/Kimi-K3
    - nvidia/Kimi-K3-NVFP4
    checkpoint_overrides:
      MiniMaxAI/MiniMax-M2:
        known:
          sglang_0516_flaky: trace NONDETERMINISTICALLY fails (~1/3 of runs) in flashinfer cutlass-DSL
            fused_add_rmsnorm via tvm_ffi 'Mismatched Tensor' — the same command text both passes and
            fails on the same GPU (12 controlled reruns 2026-08-21); every generator flag excluded by
            bisection; suspected timing-dependent tensor layout under enable-mixed-chunk. Also hits MiniMax-M2.5.
            Probe retries once and records warmup_retry; persistent failure is a record, not a block.
      deepseek-ai/DeepSeek-V4-Flash:
        variant_overrides:
          vllm: rep_mix
        render_overrides:
          vllm:
            tokens_per_block: null
      deepseek-ai/DeepSeek-V4-Pro:
        variant_overrides:
          vllm: interleave_pair
        render_overrides:
          vllm:
            tokens_per_block: null
      moonshotai/Kimi-K3:
        known:
          support: KimiK3ForConditionalGeneration unregistered in sglang 0.5.16, vllm 0.24.0, trtllm 1.3.0rc23
            (probe-verified 2026-08-20); K3 facts need a newer framework pin. Topology fork (TEP8 vs DEP8)
            reported by owner as real on K3 — verify once a supporting pin exists.
      nvidia/Kimi-K3-NVFP4:
        known:
          support: 'same as moonshotai/Kimi-K3: architecture unregistered at all three pinned framework
            versions (probe-verified 2026-08-20).'
      nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4:
        known:
          trtllm_rc23: "cudaError check abort during dummy load, root-caused 2026-08-21:
            the all_kinds dummy keeps ONE real 512-expert MoE layer (width-true rule)
            = 64B params = 120GiB bf16, over a single H20's 96GB; trtllm materializes
            dummy weights in bf16 while sglang/vllm load in checkpoint precision and
            fit. Capacity fact, not a bug — probing this checkpoint on trtllm needs
            tp8 (15GiB/rank)."
      sgl-project/DeepSeek-V4-Flash-FP8:
        variant_overrides:
          vllm: rep_mix
        render_overrides:
          vllm:
            tokens_per_block: null
      sgl-project/DeepSeek-V4-Pro-FP8:
        variant_overrides:
          vllm: interleave_pair
        render_overrides:
          vllm:
            tokens_per_block: null
topologies:
- tp: 1
  ep: 1
  evidence: real
  status: implemented
- tp: 8
  ep: 1
  evidence: real
  status: implemented
  route: launch_server + inject/sitecustomize (probe_sglang stage2 is single-process by design and cannot
    host tp>1)
  verdicts:
  - 'Kimi-K2.5 (compressed-tensors W4-packed -> marlin): TEP8 == DEP8 kernel family (sglang::fused_marlin_moe
    + device::marlin_moe::Marlin, same align/reduce/activation set; only shape-tuning template args differ).
    facts/tepdep/k25_fp8_{tep8,dep8}.rank0.json, 2026-08-21.'
- tp: 8
  ep: 8
  evidence: real
  status: implemented
  route: same as tp8, --ep-size 8
policy: 'topology is ALWAYS recorded even when kernels match (owner: Kimi-K3 TEP8 is known to fork kernels;
  K3 itself is unregistered at current pins, so the K3 verification is parked until a supporting framework
  pin exists).'
