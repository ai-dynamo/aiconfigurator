        known:
          dummy_notes: layer-kind period is FRAMEWORK-HARDCODED (sglang llama4.py:217 use_rope=(layer_id+1)%4!=0)
            with no config field -> _ARCH_IMPLICIT_PERIODS; aic-core config lacks vision_config -> merged
