apiVersion: batch/v1
kind: Job
metadata:
  name: dsv4-pro-disagg-bench
spec:
  template:
    spec:
      containers:
        - name: bench
          env:
            - {name: ISL, value: "8192"}
            - {name: OSL, value: "1024"}
            - {name: CONCURRENCIES, value: "1 8 64 128 256 512 1024"}
