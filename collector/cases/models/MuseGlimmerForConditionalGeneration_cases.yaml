schema_version: 1
architecture: MuseGlimmerForConditionalGeneration
model_path: meta-models/Muse-Glimmer-30B
model_paths:
  - meta-models/Muse-Glimmer-30B
include_base: true
base_ops:
  - gemm
framework_specific_base_ops:
  # framework_specific_base_ops is the op-activation gate. base_ops: [gemm]
  # is an explicit allowlist (model_cases.py:313-317), so attention ops MUST
  # appear here per backend to be scheduled. The frameworks: [trtllm, vllm]
  # key on the common model_case_values.attention profile is a sglang-exclusion
  # filter only (_sglang_attention_profiles, case_generator.py:198-203) — it
  # does NOT activate ops for any backend.
  sglang:
    - attention_context
    - attention_generation
  trtllm:
    - attention_context
    - attention_generation
  vllm:
    - attention_context
    - attention_generation
description: >
  Muse Glimmer 30B dense hybrid SWA/global attention collection plan:
  uniform GQA 32/2/128, sliding window 2048 (window 0 collected alongside
  as the full-attention anchor, mirroring the GPT-OSS pattern).

model_case_values:
  attention:
    # frameworks: [trtllm, vllm] is a sglang-EXCLUSION filter: _sglang_attention_
    # profiles() at case_generator.py:198-203 skips this profile when building
    # the sglang plan, keeping sglang shapes in framework_specific_model_case_values
    # below. TRT-LLM and vLLM receive shapes directly from _head_profiles().
    # sglang_runtime_window_size is sglang-only and lives in
    # framework_specific_model_case_values.sglang.attention below.
    - id: muse_glimmer_attention
      frameworks: [trtllm, vllm]
      model_path: meta-models/Muse-Glimmer-30B
      num_attention_heads: 32
      num_key_value_heads: 2
      head_dim: 128
      window_sizes: [0, 2048]
      tensor_parallel_sizes: [1, 2, 4, 8]

framework_specific_model_case_values:
  sglang:
    attention:
      # SGLang 0.5.14 requires sglang_runtime_window_size = window_size - 1
      # for the sliding-window profile (mirrors GptOssForCausalLM_cases.yaml
      # window=128→runtime=127 and Gemma4ForConditionalGeneration_cases.yaml
      # window=1024→runtime=1023). head_dim=128 uses the default SGLang
      # dispatch (fa3 on SM90, trtllm_mha on SM100/103, flashinfer on SM89/120);
      # no sglang_backends override is needed.
      - id: muse_glimmer_swa_attention
        architecture: MuseGlimmerForConditionalGeneration
        model_path: meta-models/Muse-Glimmer-30B
        num_attention_heads: 32
        num_key_value_heads: 2
        head_dim: 128
        window_size: 2048
        sglang_runtime_window_size: 2047
        tensor_parallel_sizes: [1, 2, 4, 8]
      - id: muse_glimmer_global_attention
        architecture: MuseGlimmerForConditionalGeneration
        model_path: meta-models/Muse-Glimmer-30B
        num_attention_heads: 32
        num_key_value_heads: 2
        head_dim: 128
        window_size: 0
        tensor_parallel_sizes: [1, 2, 4, 8]
