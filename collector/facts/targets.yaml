      aic_registered: openai--gpt-oss-120b
    - repo: openai/gpt-oss-20b
      profile: mxfp4
      aic_registered: openai--gpt-oss-20b
    dummy_variants:
    - interleave_pair
    - sliding_attention
    - full_attention
  kimi_k3:
    architecture: KimiK3ForConditionalGeneration
    checkpoints:
    - repo: moonshotai/Kimi-K3
      profile: bfloat16
      aic_registered: false
    - repo: nvidia/Kimi-K3-NVFP4
      profile: nvfp4
      aic_registered: false
