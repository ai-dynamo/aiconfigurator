# Flat V2 task schema: one key per Task field, no mode/config/worker_config nesting.
# `exps` lists which experiments to run (in order); each other top-level key is an experiment.
#
# These experiments are a LARGE-EP (ex-wideEP) exploration on gb200/trtllm, so
# every one of them pins its search space to the multi-node ladder. Without the
# pins each task would sweep the union of the fused (small-EP) and large-EP
# ladders — the auto-exploration default, correct for a user who wants both
# regimes compared, but roughly double the work for a file whose whole point is
# the large-EP regime. `*_tp_candidates` / `*_pp_candidates` are left unpinned
# because the fused and large-EP ladders agree on them ([1,2,4,8] and [1]), so
# the union changes nothing there.

exps:
- gb200_wideep_agg
- gb200_wideep_disagg
- gb200_wideep_eplb_agg
- gb200_wideep_eplb_slots288_agg
- gb200_wideep_eplb_disagg
- gb200_wideep_eplb_slots288_disagg
gb200_wideep_agg:
  isl: 4000
  serving_mode: agg
  total_gpus: 512
  tpot: 40.0
  ttft: 1000.0
  osl: 1000
  nextn: 1
  nextn_accepted: 0.85
  model_path: nvidia/DeepSeek-V3.1-NVFP4
  system_name: gb200
  agg_num_gpu_candidates:
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  agg_dp_candidates:
  - 2
  - 4
  - 8
