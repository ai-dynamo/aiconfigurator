<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">GB200 DeepEP-LL measured latency and OLS fits</title>
  <desc id="desc">Dispatch and combine latency measurements for hidden size 7168, top-k 8, 256 experts, with linear regression lines.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600">GB200 DeepEP-LL: H=7168, K=8, N=256, EP=4</text>
  <g stroke="#d8dee9" stroke-width="1">
    <path d="M80 440H900 M80 351.1H900 M80 262.2H900 M80 173.3H900 M80 84.4H900"/>
    <path d="M80 40V440 M285 40V440 M490 40V440 M695 40V440 M900 40V440"/>
  </g>
  <g stroke="#20242a" stroke-width="1.5">
    <path d="M80 40V440H900" fill="none"/>
  </g>
  <g fill="#4b5563" font-family="sans-serif" font-size="12">
