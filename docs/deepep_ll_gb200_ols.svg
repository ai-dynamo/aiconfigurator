    <path d="M121 72H151" stroke="#2563eb" stroke-width="2.5"/><circle cx="136" cy="72" r="4" fill="#2563eb"/>
    <text x="160" y="76" fill="#1f2937">dispatch: y = 0.0934x + 15.935 µs, β_fit = 634.3 GB/s</text>
    <path d="M121 96H151" stroke="#dc2626" stroke-width="2.5"/><circle cx="136" cy="96" r="4" fill="#dc2626"/>
    <text x="160" y="100" fill="#1f2937">combine: y = 0.1476x + 16.861 µs, β_fit = 776.8 GB/s</text>
