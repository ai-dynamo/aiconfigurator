# INPUT ONLY: what to probe and how — platform, version pins, roster,
# per-model generate args / dummy overrides / owner exclusions.
# Conclusions from probe campaigns live in findings.yaml (separate lifecycle).
schema: aic-probe-targets/v1
backends:
  sglang:
    versions:
    - 0.5.14
    - 0.5.16
    images:
      0.5.14: lmsysorg/sglang:v0.5.14
      0.5.16: lmsysorg/sglang:v0.5.16
  vllm:
    versions:
    - 0.24.0
    images:
      0.24.0: vllm-probe:0.24.0-fix
    cli_extra_args:
    - --generator-set
    - params.agg.extra_cli_args=["--benchmark-mode","agg"]
    - --generator-set
    - params.agg.trust_remote_code=true
    cli_extra_args_note: 'FPM V1 refuses to render without --benchmark-mode in extra_cli_args — questionable for
      a deploy artifact from `generate` (generator UX issue, bucket-1 candidate); required as of 2026-08-23. | trust_remote_code:
      sglang template renders it by default, vllm''s does not (backend asymmetry, bucket-1) — supplied as input
      meanwhile.'
  trtllm:
    versions:
    - 1.3.0rc23
    images:
      1.3.0rc23: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc23
families:
  dsv4:
    known_sm90:
      sglang_0516: 'CORRECTED 2026-08-23 (retracts the earlier framework_bug verdict): the ''Hidden size mismatch''
        chain was a DUMMY false positive for converted-FP8 checkpoints. sglang picks the DSV4 expert layout by probing
        the safetensors HEADER dtype of one routed-expert tensor (configs/deepseek_v4.py try_detect_fp4_experts);
        weightless dummies probed None -> env default fp4=True -> fp4-packed weights fed to the triton fp8 kernel.
        Real header dtypes (fetched from HF): native deepseek-ai = I8 (fp4-packed), sgl-project FP8 = F8_E4M3, nvidia
        NVFP4 = U8. With the dtype_probe.safetensors signal: converted-FP8 checkpoints RUN OUT OF THE BOX (ok);
        native/NVFP4 (true fp4 experts) fail under runner=auto on SM90 and RUN with moe_runner_backend=marlin ->
        needs_flags (facts/bisect_dsv4_{fp8experts,native_marlin}.json). The earlier five-runner-all-fail experiments
        ran under the wrong fp4 layout and are retracted. The ue8m0/deep_gemm SM100-only branch remains a separate
        real limit for the deep_gemm runner choice.'
      trtllm_rc23: 'DSV4 rejected at load: ''Missing COMPRESS pool metadata for compress ratio 4'' — CSA compression
        unsupported on this path.'
      trtllm_tokens_per_block: DeepseekV4CacheManager requires tokens_per_block in [128,256]; the generator renders
        64 (FPM example value) — ILLEGAL FOR THIS ARCH ON ANY PLATFORM (needs_flags for the generator). With 128
        the load proceeds to the explicit pre-blackwell rejection -> final cause on SM90 is platform_floor. Evidence
        facts/trt_ab_dsv4_tpb128.json, 2026-08-22.
      vllm_kv_required: 'INVERTED requirement vs GLM: vllm''s DeepseekV4 fp8_ds_mla layout REQUIRES fp8 kv-cache
        (attention.py:79 assert, golden auto crashed 2026-08-23) while GLM head-576 has NO backend with fp8 KV.
        kv dtype must be rendered per (model, backend) — neither blanket auto nor blanket profile->fp8 works.'
    architecture: DeepseekV4ForCausalLM
    checkpoints:
    - repo: deepseek-ai/DeepSeek-V4-Pro-0813
      profile: fp8
      aic_registered: deepseek-ai--DeepSeek-V4-Pro
      variant_overrides:
        vllm: interleave_pair
      cli_extra_args:
        sglang:
          args: &id001
          - --generator-set
          - params.agg.moe_backend=marlin
          fact: 'fp4-experts on SM90: runner=auto crashes, marlin runs (facts/bisect_dsv4_native_marlin.json)'
        vllm:
          args:
          - --generator-set
          - params.agg.kv_cache_dtype=fp8
          fact: vllm DeepseekV4 fp8_ds_mla REQUIRES fp8 KV (attention.py:79; golden-auto crash 2026-08-23)
        trtllm:
          args:
          - --generator-set
          - params.agg.tokens_per_block=128
          fact: DeepseekV4CacheManager requires tokens_per_block in [128,256]; naive renders 32 (facts/trt_ab_dsv4_tpb128.json)
    - repo: deepseek-ai/DeepSeek-V4-Flash-0731
      profile: fp8
      aic_registered: deepseek-ai--DeepSeek-V4-Flash
      cli_extra_args:
        sglang:
          args: *id001
          fact: 'fp4-experts on SM90: runner=auto crashes, marlin runs (facts/bisect_dsv4_native_marlin.json)'
        vllm:
          args:
          - --generator-set
          - params.agg.kv_cache_dtype=fp8
          fact: vllm DeepseekV4 fp8_ds_mla REQUIRES fp8 KV (attention.py:79; golden-auto crash 2026-08-23)
        trtllm:
          args:
          - --generator-set
          - params.agg.tokens_per_block=128
          fact: DeepseekV4CacheManager requires tokens_per_block in [128,256]; naive renders 32 (facts/trt_ab_dsv4_tpb128.json)
    - repo: nvidia/DeepSeek-V4-Pro-NVFP4
      profile: nvfp4
      aic_registered: false
      variant_overrides:
        vllm: interleave_pair
      cli_extra_args:
        sglang:
          args: *id001
          fact: 'fp4-experts on SM90: runner=auto crashes, marlin runs (facts/bisect_dsv4_native_marlin.json)'
        vllm:
          args:
          - --generator-set
          - params.agg.kv_cache_dtype=fp8
          fact: vllm DeepseekV4 fp8_ds_mla REQUIRES fp8 KV (attention.py:79; golden-auto crash 2026-08-23)
        trtllm:
          args:
          - --generator-set
          - params.agg.tokens_per_block=128
          fact: DeepseekV4CacheManager requires tokens_per_block in [128,256]; naive renders 32 (facts/trt_ab_dsv4_tpb128.json)
    - repo: nvidia/DeepSeek-V4-Flash-NVFP4
      profile: nvfp4
      aic_registered: false
      cli_extra_args:
        sglang:
          args: *id001
          fact: 'fp4-experts on SM90: runner=auto crashes, marlin runs (facts/bisect_dsv4_native_marlin.json)'
        vllm:
          args:
          - --generator-set
          - params.agg.kv_cache_dtype=fp8
          fact: vllm DeepseekV4 fp8_ds_mla REQUIRES fp8 KV (attention.py:79; golden-auto crash 2026-08-23)
        trtllm:
          args:
          - --generator-set
          - params.agg.tokens_per_block=128
          fact: DeepseekV4CacheManager requires tokens_per_block in [128,256]; naive renders 32 (facts/trt_ab_dsv4_tpb128.json)
    dummy_variants:
    - csa
    - hca
    - full
    - interleave_pair
    - dspark
    - hash
    - rep_mix
    variant_overrides:
      vllm: rep_mix
  glm:
    architecture: GlmMoeDsaForCausalLM
    checkpoints:
    - repo: zai-org/GLM-5.2
      profile: bfloat16
      aic_registered: zai-org--GLM-5.2
    - repo: zai-org/GLM-5.2-FP8
      profile: fp8
      aic_registered: zai-org--GLM-5.2-FP8
    - repo: nvidia/GLM-5.2-NVFP4
      profile: nvfp4
      aic_registered: nvidia--GLM-5.2-NVFP4
    dummy_variants:
    - full_indexer_moe
    - shared_indexer_moe
    known_sm90:
      trtllm_fp8kv: 'trtllm rc23/SM90 UNIFIED root cause: fp8 KV cache in the MLA/DSA path crashes natively in flash_mla
        (frame#62 abort). Door 1 = engine kv_cache_config.dtype:fp8 (generator renders for fp8 profiles) -> config_gap,
        kv-auto A/B passes (GLM-5/5.1/5.2-FP8, DSV3.2, MiniMax-M2/M2.5 whose ''Linear assert'' was the same trigger).
        Door 2 = checkpoint hf_quant kv_cache_quant_algo:FP8 (all NVFP4 artifacts) -> framework_bug, kv-auto STILL
        crashes (GLM-5/5.1-NVFP4, DSV3.2-NVFP4). Evidence facts/trt_ab_kvauto_*.json, 2026-08-22.'
  m3:
    architecture: MiniMaxM3SparseForConditionalGeneration
    checkpoints:
    - repo: MiniMaxAI/MiniMax-M3
      profile: bfloat16
      aic_registered: MiniMaxAI--MiniMax-M3
      cli_extra_args:
        trtllm:
          args:
          - --generator-set
          - params.agg.sparse_attention_config={"algorithm":"minimax_m3"}
          fact: MiniMax-M3 trtllm requires sparse_attention_config to get MiniMaxM3KVCacheManagerV2 (modeling_minimaxm3
            RuntimeError without it; facts/trt_ab_m3_sparse.json). Passthrough added to extra_engine_args template
            2026-08-23.
    - repo: MiniMaxAI/MiniMax-M3-MXFP8
      profile: mxfp8
      aic_registered: false
      cli_extra_args:
        trtllm:
          args:
          - --generator-set
          - params.agg.sparse_attention_config={"algorithm":"minimax_m3"}
          fact: MiniMax-M3 trtllm requires sparse_attention_config to get MiniMaxM3KVCacheManagerV2 (modeling_minimaxm3
            RuntimeError without it; facts/trt_ab_m3_sparse.json). Passthrough added to extra_engine_args template
            2026-08-23.
    - repo: nvidia/MiniMax-M3-NVFP4
      profile: nvfp4
      aic_registered: false
      cli_extra_args:
        trtllm:
          args:
          - --generator-set
          - params.agg.sparse_attention_config={"algorithm":"minimax_m3"}
          fact: MiniMax-M3 trtllm requires sparse_attention_config to get MiniMaxM3KVCacheManagerV2 (modeling_minimaxm3
            RuntimeError without it; facts/trt_ab_m3_sparse.json). Passthrough added to extra_engine_args template
            2026-08-23.
    dummy_variants:
    - moe_sparse_attn
    - dense_full_attn_head
    notes: custom code (auto_map) — .py files fetched into variant dirs
    known_sm90:
      trtllm_sparse_config: 'MiniMax-M3 on trtllm REQUIRES llmapi sparse_attention_config (algorithm: minimax_m3)
        to get MiniMaxM3KVCacheManagerV2 — the generator does not render it (needs_flags). With it set, rc23/SM90
        still fails deeper (MiniMaxM3SparseRuntimeBackend.forward missing cache args — framework gap, recheck on
        rc24/Blackwell). Evidence facts/trt_ab_m3_sparse.json.'
  gptoss:
    architecture: GptOssForCausalLM
    checkpoints:
    - repo: openai/gpt-oss-120b
      profile: mxfp4
      aic_registered: openai--gpt-oss-120b
    - repo: openai/gpt-oss-20b
      profile: mxfp4
      aic_registered: openai--gpt-oss-20b
    dummy_variants:
    - interleave_pair
    - sliding_attention
    - full_attention
  roster:
    excluded:
    - repo: meta-llama/Llama-4-Scout-17B-16E
      decided_by: tianhaox
      date: 2026-08-24
      reason: base variant of an already-probed Instruct checkpoint — same architecture and shapes, kernel identity
        is covered by meta-llama/Llama-4-Scout-17B-16E-Instruct; owner chose not to duplicate.
    - repo: nvidia/nemotron-ultra-rl-050826
      decided_by: tianhaox
      date: 2026-08-24
      reason: internal RL checkpoint with no public artifact; revisit if it gets a public release.
    architecture: full support-matrix roster (per-checkpoint, no arch dedup)
    derive: true
    extra_repos:
    - moonshotai/Kimi-K3
    - nvidia/Kimi-K3-NVFP4
    - nvidia/DeepSeek-V3.2-NVFP4
    checkpoint_overrides:
      nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-FP8:
        dummy_overrides:
          hfquant_exclude_from_sibling: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
          drop_auto_map: gated custom code; official NVFP4 sibling has no auto_map (native nemotron_h)
          fact: gated repo ships condensed hf_quant (no exclude_modules) + unobtainable custom code; sibling NVFP4
            artifact carries the structural exclusion set and resolves natively. Moved from gen_dummy_models.py
            hardcoded tables 2026-08-24.
      deepseek-ai/DeepSeek-V4-Flash:
        dummy_overrides:
          family: dsv4
        variant_overrides:
          vllm: rep_mix
        cli_extra_args:
          sglang:
            args: *id001
            fact: 'fp4-experts on SM90: runner=auto crashes, marlin runs (facts/bisect_dsv4_native_marlin.json)'
          vllm:
            args: &id002
            - --generator-set
            - params.agg.kv_cache_dtype=fp8
            fact: vllm DeepseekV4 fp8_ds_mla REQUIRES fp8 KV (attention.py:79; golden-auto crash 2026-08-23)
          trtllm:
            args: &id003
            - --generator-set
            - params.agg.tokens_per_block=128
            fact: DeepseekV4CacheManager requires tokens_per_block in [128,256]; naive renders 32 (facts/trt_ab_dsv4_tpb128.json)
      deepseek-ai/DeepSeek-V4-Pro:
        dummy_overrides:
          family: dsv4
        variant_overrides:
          vllm: interleave_pair
        cli_extra_args:
          sglang:
            args: *id001
            fact: 'fp4-experts on SM90: runner=auto crashes, marlin runs (facts/bisect_dsv4_native_marlin.json)'
          vllm:
            args: *id002
            fact: vllm DeepseekV4 fp8_ds_mla REQUIRES fp8 KV (attention.py:79; golden-auto crash 2026-08-23)
          trtllm:
            args: *id003
            fact: DeepseekV4CacheManager requires tokens_per_block in [128,256]; naive renders 32 (facts/trt_ab_dsv4_tpb128.json)
      sgl-project/DeepSeek-V4-Flash-FP8:
        dummy_overrides:
          family: dsv4
        variant_overrides:
          vllm: rep_mix
        cli_extra_args:
          vllm:
            args:
            - --generator-set
            - params.agg.kv_cache_dtype=fp8
            fact: vllm DeepseekV4 fp8_ds_mla REQUIRES fp8 KV (attention.py:79; golden-auto crash 2026-08-23)
          trtllm:
            args:
            - --generator-set
            - params.agg.tokens_per_block=128
            fact: DeepseekV4CacheManager requires tokens_per_block in [128,256]; naive renders 32 (facts/trt_ab_dsv4_tpb128.json)
      sgl-project/DeepSeek-V4-Pro-FP8:
        dummy_overrides:
          family: dsv4
        variant_overrides:
          vllm: interleave_pair
        cli_extra_args:
          vllm:
            args:
            - --generator-set
            - params.agg.kv_cache_dtype=fp8
            fact: vllm DeepseekV4 fp8_ds_mla REQUIRES fp8 KV (attention.py:79; golden-auto crash 2026-08-23)
          trtllm:
            args:
            - --generator-set
            - params.agg.tokens_per_block=128
            fact: DeepseekV4CacheManager requires tokens_per_block in [128,256]; naive renders 32 (facts/trt_ab_dsv4_tpb128.json)
      meta-llama/Llama-4-Maverick-17B-128E-Instruct:
        variant_overrides:
          sglang: depth4
          vllm: depth4
topologies:
- tp: 1
  ep: 1
  evidence: real
  status: implemented
- tp: 8
  ep: 1
  evidence: real
  status: implemented
  route: launch_server + inject/sitecustomize (probe_sglang stage2 is single-process by design and cannot host tp>1)
- tp: 8
  ep: 8
  evidence: real
  status: implemented
  route: same as tp8, --ep-size 8
topology_policy:
  default: tp1
  note: topology is ALWAYS recorded in records.runtime (tp/ep/dp/a2a) even when kernels match.
  deepep_required:
  - repo: moonshotai/Kimi-K3
    reason: 'owner request 2026-08-24: K3 must be probed on the deepep a2a route (independent kernel path); other
      models are represented by tp1 per the invariance fact.'
platform:
  name: h20_sm90
  sm: 90
  system: h200_sxm
  facts_systems:
  - h100_sxm
  - h200_sxm
tooling:
  vllm_probe_base_image: vllm/vllm-openai:v0.24.0
  note: 'aiconfigurator-core wheel version is READ FROM aic/pyproject.toml (the checkout declares it); only probe-specific
    pins live here. Why the -fix image exists: see findings.yaml vllm_024_image_tilelang_stub.'
