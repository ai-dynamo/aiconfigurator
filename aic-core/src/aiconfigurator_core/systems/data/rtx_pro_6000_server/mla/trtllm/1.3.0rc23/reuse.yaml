- table: context_mla_perf
  from_version: 1.3.0rc20
  reason: "Dynamo 1.3.0 pins trtllm 1.3.0rc23 for MiniMax-M3; this marker (a) reuses the rc-stable rc20 MLA tables per the rc15->rc10 precedent in this family and (b) anchors the rc23 version root on this system so the exact-version gate passes. Every OTHER family deliberately carries no rc23 marker - the source resolver's native strictly-earlier sibling inheritance serves their rc20 tables with per-source provenance. The msa family has no rtx table or donor (collection blocked on pool availability): M3 MSA queries fail with a typed EmpiricalNotImplemented, an explicitly rejected cell."
