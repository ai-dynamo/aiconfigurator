# rc23 triton reference path on SM89; the fmha_sm100 implementation is
# SM100/103-only, so the implementation probe selects "triton"
# (tokens_per_block=32 branch) and kernel_source = default (triton
# fallback) is the serving-true lane on this system.
# Multi-slice campaign: the run spanned several 4h scheduler slices with
# checkpoint resume (--resume --resume-retry-failed). The final staging
# table carried 3246 ctx + 2 gen same-key duplicate rows from slice
# replay (re-measurements of identical cases, median latency delta 0.2%)
# — deduplicated keep-last at merge: ctx 6559 -> 3313, gen 2510 -> 2508.
# msa tables accepted complete: all 856 ValueError failures (488 ctx +
# 368 gen) are the serving-unreachable num_heads=128 shard class
# ("num_index_heads (4) must be divisible by num_kv_heads (8)") plus 173
# giant-shape OOM-family failures on the 48GB card (104 ctx CUDA OOM at
# 32-64 GiB allocations; 69 gen = 49 CUDA OOM + 20 kv-cache-manager
# CuOOMError). Slice-retry duplicate failure records counted once; 8
# early-slice OOM transients were rescued by retry-failed. One ctx and
# one gen case carry both a successful row and a final-slice failure
# record (resume ambiguity) — the measured rows are kept.
# Collected on 8x L40S via internal collection CI, 2026-08-09.
# 2026-08-13: generation rows re-keyed step -> step - 1 (PR #1507 review
# 4911044624): the collector cached kv-1 tokens so each measurement's true
# total decode length is one below the previously persisted coordinate
# (loader key s = isl + step). The measurements themselves are valid; only
# the key was shifted to the measured coordinate. New collections use the
# corrected construction (kv cached tokens, current token at position kv).
