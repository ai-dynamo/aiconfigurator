families:
  dsv4:
    architecture: DeepseekV4ForCausalLM
    checkpoints:
    - repo: deepseek-ai/DeepSeek-V4-Pro-0813
      profile: fp8
      aic_registered: deepseek-ai--DeepSeek-V4-Pro
      known: 'SM90: loads silently, Fp8MoEMethod over fp4-packed int8 experts, first MoE forward crashes
        (both sglang versions)'
    - repo: deepseek-ai/DeepSeek-V4-Flash-0731
      profile: fp8
      aic_registered: deepseek-ai--DeepSeek-V4-Flash
      known: same W4A8 crash class as Pro
    - repo: nvidia/DeepSeek-V4-Pro-NVFP4
      profile: nvfp4
      aic_registered: false
    - repo: nvidia/DeepSeek-V4-Flash-NVFP4
      profile: nvfp4
      aic_registered: false
      known: 'SM90: MoE dispatches to Marlin (bf16 dequant), NOT fp4 tensor cores'
    dummy_variants:
    - csa
    - hca
    - full
    - interleave_pair
    - dspark
    - hash
    - rep_mix
    variant_overrides:
      vllm: rep_mix
    render_overrides:
      vllm:
        tokens_per_block: null
  glm:
    architecture: GlmMoeDsaForCausalLM
    checkpoints:
    - repo: zai-org/GLM-5.2
      profile: bfloat16
      aic_registered: zai-org--GLM-5.2
      known: 'SM90 auto: KV bf16, dsa prefill=flashmla_sparse decode=fa3; dense FA3 branch below index_topk=2048'
    - repo: zai-org/GLM-5.2-FP8
      profile: fp8
      aic_registered: zai-org--GLM-5.2-FP8
      known: explicit fp8_e4m3 KV honored on SM90 -> flashmla_kv both phases; decode includes online K-cache
        quantize
    - repo: nvidia/GLM-5.2-NVFP4
      profile: nvfp4
      aic_registered: nvidia--GLM-5.2-NVFP4
    dummy_variants:
    - full_indexer_moe
    - shared_indexer_moe
  m3:
    architecture: MiniMaxM3SparseForConditionalGeneration
    checkpoints:
    - repo: MiniMaxAI/MiniMax-M3
