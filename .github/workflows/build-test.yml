name: "Build and Test"

on:
  push:
    branches:
      - main
      - "release/*"
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

concurrency:
  # One in-flight run per PR: a superseded push cancels the previous run.
  # Push events group by SHA so main/release runs never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install and run cargo-deny
        working-directory: aic-core/rust/aiconfigurator-core
        # Default log level (warn) surfaces "license inferred from file" notes
        # so any crate that may need a [[licenses.clarify]] entry is named.
        # --show-stats prints a per-license usage summary at the end.
        run: |
          cargo-deny --version || cargo install cargo-deny@0.19.0
          cargo-deny --all-features check --show-stats licenses bans

  core-public-api-contract:
    name: aic-core public API contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 0
      - name: Git LFS Pull
        run: git lfs pull
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            aic-core/rust/aiconfigurator-core
      - name: Test crate without Python embedding
        run: cargo test --workspace --no-default-features
      - name: Install the local wheel and upper compatibility package
        run: |
          python -m pip install uv
          uv sync --extra dev
      - name: Test Python package contracts
        run: |
          uv run pytest -q \
            tests/cross_package/test_core_public_api.py \
            tests/cross_package/test_core_version_contract.py \
            tests/cross_package/test_import_contract.py \
            tests/cross_package/test_single_oracle_contract.py
      - name: Test crate with Python embedding
        env:
          AIC_REQUIRE_EMBEDDED_ROUND_TRIP: '1'
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PYTHONPATH: ${{ github.workspace }}/aic-core/src:${{ github.workspace }}/.venv/lib/python3.13/site-packages:${{ github.workspace }}/src
        run: cargo test --workspace --all-features

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AIC and test dependencies
        run: |
          python -m pip install uv
          uv sync --python ${{ matrix.python-version }} --extra dev --locked
      - name: Verify Python and NumPy compatibility
        run: |
          uv pip check
          uv run python -c 'import sys, numpy; from packaging.version import Version; assert f"{sys.version_info.major}.{sys.version_info.minor}" == "${{ matrix.python-version }}"; assert Version("2.1") <= Version(numpy.__version__) < Version("3")'
      - name: Test Python package contracts
        run: |
          uv run pytest -q \
            tests/cross_package/test_core_public_api.py \
            tests/cross_package/test_core_version_contract.py \
            tests/cross_package/test_import_contract.py \
            tests/cross_package/test_single_oracle_contract.py

  build-and-test:
    name: Build and Test (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: unit
            paths: tests/unit
            workers: "-n 2"
          - name: e2e
            paths: tests/e2e
            workers: "-n 4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 0
      - name: Detect diff-scoped test selection
        id: generator-golden-changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          head_sha="${{ github.sha }}"

          if [ -z "${base_sha}" ] || [[ "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"
          echo "Changed files:"
          printf '%s\n' "${changed_files}"

          if printf '%s\n' "${changed_files}" | grep -Eq '^(src/aiconfigurator/generator/|tests/golden/generator/)'; then
            echo "run_golden=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_golden=false" >> "${GITHUB_OUTPUT}"
          fi

          # Scope test_validate_database (e2e sanity check) to the diff:
          # "all" when the sanity tooling / DB loader changed, otherwise the
          # changed perf-data paths (empty -> sentinel combo only). Consumed
          # via AIC_SANITY_TARGETS in tests/e2e/tools/test_sanity_check.py.
          sanity_all_regex='^(tools/sanity_check/|tests/e2e/tools/test_sanity_check\.py|aic-core/src/aiconfigurator_core/sdk/perf_database\.py)'
          if printf '%s\n' "${changed_files}" | grep -Eq "${sanity_all_regex}"; then
            sanity_targets="all"
          else
            sanity_targets="$(printf '%s\n' "${changed_files}" | grep -E '^aic-core/src/aiconfigurator_core/systems/' || true)"
          fi
          {
            echo "sanity_targets<<AIC_SANITY_EOF"
            printf '%s\n' "${sanity_targets}"
            echo "AIC_SANITY_EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Git LFS Pull
        run: git lfs pull
      - name: Print runner resources
        run: |
          echo "CPU cores: $(nproc)"
          free -h
      - name: Build wheels and verify SDK import namespaces
        run: |
          docker build -f docker/Dockerfile -t aiconfigurator:build --target build .
      - name: Run tests in container
        shell: bash
        env:
          # Env indirection (not ${{ }} inline in the script) so fork-PR
          # filenames can never be shell-interpreted; docker -e forwards the
          # value verbatim.
          AIC_SANITY_TARGETS: ${{ steps.generator-golden-changes.outputs.sanity_targets }}
        run: |
          test_paths=(${{ matrix.suite.paths }})
          if [ "${{ matrix.suite.name }}" = "unit" ] && [ "${{ steps.generator-golden-changes.outputs.run_golden }}" = "true" ]; then
            test_paths+=(tests/golden/generator)
          fi
          echo "Running pytest paths: ${test_paths[*]}"

          docker build -f docker/Dockerfile -t aiconfigurator:test --target test .
          # Fail-closed loader provenance checks (Collector V3 design §7.4); the
          # committed data tree is fully sidecar-covered post-PR3, so this must stay green.
          docker run --name aic -e AIC_STRICT_PROVENANCE=1 -e AIC_SANITY_TARGETS aiconfigurator:test \
            pytest \
            "${test_paths[@]}" \
            -m "unit or build" \
            -v --tb=short --maxfail=1 --timeout=600 \
            ${{ matrix.suite.workers }} \
            --md-report --md-report-verbose=1 --md-report-flavor gfm --md-report-output test_report.md
      - name: Copy test report from test Container
        if: always()
        run: |
            docker cp aic:/workspace/test_report.md ./test_report.md


  rust-engine-step-parity:
    name: Rust/Python engine-step parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 0
      - name: Git LFS Pull
        # Current perf parquet tables are checked in directly; materialize any
        # legacy LFS assets retained for compatibility coverage.
        run: git lfs pull
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - name: Cache Rust build artifacts
        # Caches ~/.cargo registry + incremental target dirs, keyed on
        # Cargo.lock + rustc version; correctness-neutral (stale keys miss).
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            aic-core/rust/aiconfigurator-core
      - name: Install AIC and test dependencies
        run: |
          python -m pip install uv
          uv sync --extra dev
          uv pip install --python .venv/bin/python maturin
      - name: Build the aiconfigurator_core Rust extension
        # The AICONFIGURATOR_RUST_CORE_AUTOBUILD env var is a no-op; the compiled
        # aiconfigurator_core extension must be built explicitly with maturin so
        # the parity suite exercises the current Rust source. The Maturin project
        # is the standalone core wheel under aic-core.
        run: |
          cd aic-core
          VIRTUAL_ENV="${GITHUB_WORKSPACE}/.venv" \
            "${GITHUB_WORKSPACE}/.venv/bin/maturin" develop --release
      - name: Run Rust unit tests (cargo test)
        # The crate's own oracle/unit tests were previously NOT in any gate,
        # which let "match Python" pins go stale silently (e.g. the b200
        # mem_bw test survived a YAML correction unnoticed). The py:: binding
        # tests self-initialize the interpreter (prepare_freethreaded_python),
        # so plain `cargo test --lib` covers them; PYO3_PYTHON pins the venv
        # interpreter for linking.
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo test --release --lib
      - name: Run Rust/Python engine-step parity suite
        # -n 4 matches the 4-vCPU hosted runner; every case builds its own
        # engines, so the suite is xdist-safe. The perf gate below must stay
        # serial (it measures p50 timings).
        run: |
          "${GITHUB_WORKSPACE}/.venv/bin/pytest" -q -rx -n 4 \
            aic-core/rust/aiconfigurator-core/parity_tests/test_engine_step_parity.py
      - name: Run compile-engine (EngineHandle) parity suite
        # Parity for the compile_engine -> EngineHandle path: op-transfer bincode
        # round-trip fidelity plus integration parity vs the Python BaseBackend.
        run: |
          "${GITHUB_WORKSPACE}/.venv/bin/pytest" -q -rx -n 4 \
            aic-core/rust/aiconfigurator-core/parity_tests/test_compile_engine_parity.py
