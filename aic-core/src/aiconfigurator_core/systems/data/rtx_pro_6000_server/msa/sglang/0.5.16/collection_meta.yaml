# SM120 attention-backend exception (owner-authorized, 2026-08-09):
# v0.5.16's M3 server-args handler has no CC-12 branch (HIP/SM100/SM90
# only; the SM predicates are capability-major-exact), so ServerArgs falls
# to the generic MHA default = flashinfer + page_size 1, which crashes at
# backend init on every M3 case (the M3 sparse KV pool carries no
# quant_method -> flashinfer AttributeError). Default-config serving
# crashes identically, so there is no framework-selected default to record
# on this platform. The collector therefore passes the user-facing
# ServerArgs escape hatch --attention-backend triton — a legitimate
# serving knob, not a collector invention — and prefix cases use the
# token-level (page 1) allocator emulation. Full failure-evidence and
# source citations: collector/sglang/collect_msa_module.py (SM120 block).
# context: 2 tp=1 sweep tails died at the plan's two largest prefixes
