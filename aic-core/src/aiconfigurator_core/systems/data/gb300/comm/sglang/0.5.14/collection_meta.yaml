schema_version: 1
provenance: legacy
runtime:
  framework: sglang
  version: 0.5.14
tables:
  # TP2/TP4 rows are the original legacy wave; TP8/TP16 multi-node rows
  # were added 2026-08-12 from a 4-node x 4-GPU GB300 NVL fleet via
  # torchrun, closing the num_gpus > 4 gap behind issue #1416 (GB300 is
  # 4 GPUs per node, so serving-relevant TP sizes all span nodes and had
  # no measured data). 23 message sizes x {graph, eager}; message_size
  # counts BF16 elements, so the 128..536,870,912 range spans 256B..1GiB.
  # kernel_source caveat: SGLang_CustomAllReduce_{eager,graph} records launch
  # mode, not the per-call backend. SGLang v0.5.14 dispatches through
  # python/sglang/srt/distributed/parallel_state.py:578-660;
  # device_communicators/custom_all_reduce.py:260-274 rejects a cross-node
  # non-fully-connected group before the PyNCCL fallback. This run did not
  # instrument that decision, so TP8/TP16 cannot be retrospectively relabeled
  # without fabricating provenance; recollection must record it.
  custom_allreduce_perf:
    status: complete
