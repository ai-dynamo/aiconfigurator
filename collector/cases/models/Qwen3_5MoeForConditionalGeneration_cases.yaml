schema_version: 1
architecture: Qwen3_5MoeForConditionalGeneration
model_path: Qwen/Qwen3.5-397B-A17B
model_paths:
  - Qwen/Qwen3.5-35B-A3B
  - Qwen/Qwen3.5-122B-A10B
  - Qwen/Qwen3.5-397B-A17B
  - nvidia/Qwen3.5-122B-A10B-NVFP4
  - nvidia/Qwen3.5-397B-A17B-NVFP4
  - nvidia/Qwen3.6-35B-A3B-NVFP4
include_base: true
base_ops:
  - attention_context
  - attention_generation
  - gemm
description: >
  Qwen3.5 MoE/GDN model-centric collection plan.

model_case_values:
  attention:
    - id: qwen35_35b_attention
      model_path: Qwen/Qwen3.5-35B-A3B
      model_aliases:
        - nvidia/Qwen3.6-35B-A3B-NVFP4
      num_attention_heads: 16
      num_key_value_heads: 2
      head_dim: 256
      window_size: 0
      sglang_backends: {90: fa3, 100: triton, 103: triton, 120: flashinfer}
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
    - id: qwen35_122b_attention
      model_path: Qwen/Qwen3.5-122B-A10B
      model_aliases:
        - nvidia/Qwen3.5-122B-A10B-NVFP4
      num_attention_heads: 32
      num_key_value_heads: 2
      head_dim: 256
      window_size: 0
      sglang_backends: {90: fa3, 100: triton, 103: triton, 120: flashinfer}
      tensor_parallel_sizes: [1, 2, 4, 8, 16, 32]
    - id: qwen35_397b_attention
      model_path: Qwen/Qwen3.5-397B-A17B
      model_aliases:
        - nvidia/Qwen3.5-397B-A17B-NVFP4
      num_attention_heads: 32
      num_key_value_heads: 2
      head_dim: 256
      window_size: 0
      sglang_backends: {90: fa3, 100: triton, 103: triton, 120: flashinfer}
      tensor_parallel_sizes: [1, 2, 4, 8, 16, 32]
  moe:
    - model_path: Qwen/Qwen3.5-35B-A3B
      hidden_size: 2048
      inter_size: 512
      topk: 8
      num_experts: 256
      sglang_moe_routing_method_type: RenormalizeNaive
      sglang_moe_backends:
        bfloat16: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
        fp8_block: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
    - model_path: Qwen/Qwen3.5-122B-A10B
      hidden_size: 3072
      inter_size: 1024
      topk: 8
      num_experts: 256
      sglang_moe_routing_method_type: RenormalizeNaive
      sglang_moe_backends:
        bfloat16: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
        fp8_block: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
    - model_path: Qwen/Qwen3.5-397B-A17B
      hidden_size: 4096
      inter_size: 1024
      topk: 10
      num_experts: 512
      sglang_moe_routing_method_type: RenormalizeNaive
      sglang_moe_backends:
        bfloat16: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
        fp8_block: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
    - model_path: nvidia/Qwen3.6-35B-A3B-NVFP4
      hidden_size: 2048
      inter_size: 512
      topk: 8
      num_experts: 256
      sglang_moe_routing_method_type: RenormalizeNaive
      framework_quantization:
        sglang:
          allowed_modes: [w4a16_nvfp4]
        trtllm:
          allowed_modes: [w4a16_nvfp4]
        vllm:
          allowed_modes: [w4a16_nvfp4]
    - model_path: nvidia/Qwen3.5-122B-A10B-NVFP4
      hidden_size: 3072
      inter_size: 1024
      topk: 8
      num_experts: 256
      sglang_moe_routing_method_type: RenormalizeNaive
      framework_quantization:
        sglang:
          allowed_modes: [nvfp4]
        trtllm:
          allowed_modes: [nvfp4]
        vllm:
          allowed_modes: [nvfp4]
    # NVFP4 artifact (experts-only ModelOpt recipe; kv fp8). Serving pin:
    # sglang launched with --quantization modelopt_fp4 --moe-runner-backend
    # flashinfer_trtllm (InferenceX runs 28131757535 / 28719981652,
    # sglang v0.5.14-cu130 image); re-verify against sglang 0.5.14 moe
    # runner dispatch on version bumps.
    - model_path: nvidia/Qwen3.5-397B-A17B-NVFP4
      frameworks: [sglang]
      hidden_size: 4096
      inter_size: 1024
      topk: 10
      num_experts: 512
      sglang_moe_routing_method_type: RenormalizeNaive
      sglang_moe_backends:
        nvfp4: {100: flashinfer_trtllm, 103: flashinfer_trtllm}
      framework_quantization:
        sglang:
          allowed_modes: [nvfp4]
  gemm:
    # Exact widths below the base feature grid (min 32): scalar shared-expert
    # gate (hidden -> 1) and GDN in_proj_ba (2 * num_v_heads / tp).
    - model_path: Qwen/Qwen3.5-35B-A3B
      model_aliases:
        - nvidia/Qwen3.6-35B-A3B-NVFP4
      output_feature_sizes: [1, 4, 8, 16]
      input_feature_sizes: [2048]
    - model_path: Qwen/Qwen3.5-122B-A10B
      model_aliases:
        - nvidia/Qwen3.5-122B-A10B-NVFP4
      output_feature_sizes: [1, 8, 16]
      input_feature_sizes: [3072]
    - model_path: Qwen/Qwen3.5-397B-A17B
      model_aliases:
        - nvidia/Qwen3.5-397B-A17B-NVFP4
      output_feature_sizes: [1, 8, 16]
      input_feature_sizes: [4096]
  gdn:
    - model_path: Qwen/Qwen3.5-35B-A3B
      model_aliases:
        - nvidia/Qwen3.6-35B-A3B-NVFP4
      d_model: 2048
      d_conv: 4
      num_k_heads: 16
      head_k_dim: 128
      num_v_heads: 32
      head_v_dim: 128
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
    # 122B/397B attention declares TP32, but num_k_heads=16 cannot shard 32 ways — no TP32 GDN geometry.
    - model_path: Qwen/Qwen3.5-122B-A10B
      model_aliases:
        - nvidia/Qwen3.5-122B-A10B-NVFP4
      d_model: 3072
      d_conv: 4
      num_k_heads: 16
      head_k_dim: 128
      num_v_heads: 64
      head_v_dim: 128
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
    - model_path: Qwen/Qwen3.5-397B-A17B
      model_aliases:
        - nvidia/Qwen3.5-397B-A17B-NVFP4
      d_model: 4096
      d_conv: 4
      num_k_heads: 16
      head_k_dim: 128
      num_v_heads: 64
      head_v_dim: 128
      tensor_parallel_sizes: [1, 2, 4, 8, 16]

all_frameworks_op_cases:
  moe:
    cases: all
  gdn:
    cases: all
