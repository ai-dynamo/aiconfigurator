#
# Collector V3 manifest (schema v2): one `default` runtime per framework plus
# explicit per-family overrides (design: docs/perf_database/
# collector-v3-op-centric-design.md §4). Public images are digest-pinned;
# bare internal image names are exempt. WideEP runtimes are peer framework
# entries (wideep_<base>) so per-op resolution is uniform.

schema_version: 2

frameworks:
  sglang:
    source_repo: "https://github.com/sgl-project/sglang.git"
    default:
      version: "0.5.14"
      images:
        default: "lmsysorg/sglang:v0.5.14@sha256:5027e95bf6ec536856b1b52a91d1f35ff5c564ab83e8a94758a169ff09bb8df3"
        cu130: "lmsysorg/sglang:v0.5.14-cu130@sha256:5027e95bf6ec536856b1b52a91d1f35ff5c564ab83e8a94758a169ff09bb8df3"
    families:
      # Kimi-K3 KDA kernels exist only on the sglang kimi-k3 branch
      # (https://github.com/sgl-project/sglang/tree/kimi-k3), whose build
      # reports 0.5.16. Pin the branch image for the kda family only.
      kda:
        version: "0.5.16"
        images:
          default: "lmsysorg/sglang@sha256:4b8a7542e00a4d82801d1276108438b024137c9a07f33215d03b04003e500f2b"
  trtllm:
    source_repo: "https://github.com/NVIDIA/TensorRT-LLM.git"
    default:
      version: "1.3.0rc10"
      images:
        default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc10@sha256:fd68e7500952100df58bb3682c4ea69b6e6723dc4d13dfc911a1bdee80ac389a"
  vllm:
    source_repo: "https://github.com/vllm-project/vllm.git"
    default:
      version: "0.24.0"
      images:
        default: "vllm/vllm-openai:v0.24.0@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f"
        cu129: "vllm/vllm-openai:v0.24.0-cu129@sha256:6b005c78cd17a1f0215f31e95d183833f4dfd6167c4473241b80d1c8843b91e8"
    families:
      # Kimi-K3 KDA kernels exist only on the vLLM kimi-k3 branch
      # (official preview image, CUDA 13 build with fused_kda_decode +
      # FlashKDA; setuptools-scm version 0.1.dev19262+gb6bbf29dd).
      kda:
        version: "0.1.dev19262"
        images:
          default: "vllm/vllm-openai@sha256:e90e2603b2781936651ba019804137714367c69e10a7b25a2e57b46995225616"
      # K3-driven pin (owner decision 2026-08-01): stock v0.24.0 has no SITU
      # activation (upstream v0.24.0 activation.py), so a Kimi-K3
      # compressed-tensors mxfp4 case there would dispatch CUTLASS W4A4 +
      # silu — a different kernel than K3 serving (SITU -> MarlinExperts
      # weight-only, compressed_tensors_moe_w4a4_mxfp4.py:58-71 @ preview).
      # The preview build is a superset of the stock moe paths, so non-K3
      # vllm moe collections remain valid here; the family schema has no
      # per-model pin (recorded image-routing gap). Pre-existing 0.24.0 moe
      # rows are untouched; K3 rows merge into the 0.24.0 table per the
      # owner decision, carrying their honest runtime version column.
      # Re-verify at the next tag bump. (2026-08-02 audit: the tag's amd64
      # image is IDENTICAL to this pin — 0.1.dev19262+gb6bbf29dd, no
      # deep_gemm; the earlier "drift to sha256:d61e062d" observation was
      # the manifest list's arm64 entry, not a new build.)
      moe:
        version: "0.1.dev19262"
        images:
          default: "vllm/vllm-openai@sha256:e90e2603b2781936651ba019804137714367c69e10a7b25a2e57b46995225616"
  wideep_sglang:
    base_framework: sglang
    collector_dir: "collector/wideep/sglang"
    data_backend: sglang
    default:
      version: "0.5.10"
      images:
        default: "deepseek-v4-blackwell"
        grace_blackwell: "deepseek-v4-grace-blackwell"
    notes: >
      Requires an SGLang image with DeepSeek-V4/DeepEP modules; stock
      lmsysorg/sglang images may not include them.
  wideep_trtllm:
    base_framework: trtllm
    collector_dir: "collector/wideep/trtllm"
    data_backend: trtllm
    default:
      version: "1.3.0rc10"
      images:
        default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc10@sha256:fd68e7500952100df58bb3682c4ea69b6e6723dc4d13dfc911a1bdee80ac389a"
