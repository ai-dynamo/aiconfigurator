schema_version: 1
architecture: LagunaForCausalLM
model_path: poolside/Laguna-S-2.1-FP8
model_paths:
  - poolside/Laguna-S-2.1-FP8
  - poolside/Laguna-XS.2-FP8
include_base: true
description: >
  Official Laguna-S 2.1 and Laguna-XS.2 FP8 hybrid full/SWA attention plus
  routed-MoE collection plan. Covers each checkpoint's routed expert shape,
  full-attention head count, and SWA windowed attention shape.

model_case_values:
  moe:
    - model_paths:
        - poolside/Laguna-S-2.1-FP8
      hidden_size: 3072
      inter_size: 1024
      topk: 10
      num_experts: 256
      # Block-FP8 requires the per-rank intermediate width to remain divisible
      # by the checkpoint's 128-element quantization block.
      max_tp_exclusive: 16
      framework_quantization:
        # Laguna routing is implemented only by the vLLM collector. Keep
        # cross-model sweeps from persisting this geometry with another
        # backend's default routing identity.
        sglang:
          allowed_modes: []
        trtllm:
          allowed_modes: []
        vllm:
          allowed_modes:
            - fp8_block
    - model_paths:
        - poolside/Laguna-XS.2-FP8
      hidden_size: 2048
      inter_size: 512
      topk: 8
      num_experts: 256
      # The checkpoint's 128-element FP8 block permits routed-expert tensor
      # parallelism only through TP4 because 512 / TP8 is 64.
      max_tp_exclusive: 8
      framework_quantization:
        sglang:
          allowed_modes: []
        trtllm:
          allowed_modes: []
        vllm:
          # The current moe_perf key already exists for Qwen3.5-35B-A3B,
          # whose generic FP8/softmax invocation differs from Laguna's
          # compressed-tensors/sigmoid/bias/scaled routing contract. Leave
          # this lane fail-closed until the consumer can distinguish them.
          allowed_modes: []
  attention:
    - id: laguna_s2_full_attention
      model_path: poolside/Laguna-S-2.1-FP8
      frameworks: [vllm]
      num_attention_heads: 48
      num_key_value_heads: 8
      head_dim: 128
      window_size: 0
      tensor_parallel_sizes: [1, 2, 4, 8]
    - id: laguna_s2_sliding_attention
      model_path: poolside/Laguna-S-2.1-FP8
      frameworks: [vllm]
      num_attention_heads: 72
      num_key_value_heads: 8
      head_dim: 128
      window_size: 512
      tensor_parallel_sizes: [1, 2, 4, 8]
    - id: laguna_xs2_full_attention
      model_path: poolside/Laguna-XS.2-FP8
      frameworks: [vllm]
      num_attention_heads: 48
      num_key_value_heads: 8
      head_dim: 128
      window_size: 0
      # TP8 is not a serving-valid topology: the checkpoint quantizes its
      # 512-wide shared expert in 128x128 blocks, leaving 64 columns per rank.
      tensor_parallel_sizes: [1, 2, 4]
    - id: laguna_xs2_sliding_attention
      model_path: poolside/Laguna-XS.2-FP8
      frameworks: [vllm]
      num_attention_heads: 64
      num_key_value_heads: 8
      head_dim: 128
      window_size: 512
      tensor_parallel_sizes: [1, 2, 4]

framework_specific_op_cases:
  vllm:
    moe:
      cases: all
