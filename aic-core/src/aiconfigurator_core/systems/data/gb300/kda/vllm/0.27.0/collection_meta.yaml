  # SM103 (GB300) vllm kda at upstream v0.27.0 (Kimi-K3 landed upstream; the
  # manifest kda family pin stays on the preview until the consumer routes
  # 0.27.0's split decode — see collector/framework_manifest.yaml). Collected
